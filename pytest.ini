[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = --cov=hub_api --cov-report=term-missing
markers =
    postgres: runs against a real PostgreSQL instance instead of SQLite.
        Needs HUB_TEST_DATABASE_URL (see README). Deselect with
        -m "not postgres" for the default offline run.
