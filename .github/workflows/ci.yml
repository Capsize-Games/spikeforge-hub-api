name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hubtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # capsize-auth is not on PyPI yet, so it is installed from source
      # first, matching the Dockerfile's CAPSIZE_AUTH_SPEC build argument.
      # Without this the project install below fails to resolve the
      # dependency at all.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install \
            "capsize-auth @ git+https://github.com/capsize-games/capsize-auth.git@main"
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy hub_api

      - name: Tests (SQLite)
        run: pytest -q

      # The same suite against the deployment's actual database. SQLite
      # cannot catch a dialect difference, and the schema has at least two
      # places where one could hide: the JSONB variant and the
      # timezone-aware timestamp decorator.
      - name: Tests (PostgreSQL)
        env:
          HUB_TEST_DATABASE_URL: >-
            postgresql+psycopg://postgres:test@127.0.0.1:5432/hubtest
        run: pytest -q --no-cov

      - name: Migrations apply and reverse on a clean database
        env:
          SPIKEFORGE_HUB_DATABASE_URL: >-
            postgresql+psycopg://postgres:test@127.0.0.1:5432/hubtest
          SPIKEFORGE_HUB_TOKEN_SECRET: ${{ github.sha }}0000000000000000000000
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
