# Type-checking gate for the hub API.
#
# Unlike the main spikeforge repository this service has no partially-typed
# scientific dependencies, so the gate starts strict and carries no
# exclusions. Keep it that way: an exclusion added here is a debt with no
# ratchet behind it.

[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
exclude = (?x)(^\.venv/|^migrations/versions/)
