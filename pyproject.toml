# PEP 621 packaging authority for the hub API service.
#
# This is a *service*, not a distribution: nothing ``pip install``s it from an
# index. The packaging metadata exists so the container build, the linters, and
# the test suite all agree on one dependency set and one import root.
#
# The client half of the hub lives in the ``spikeforge-hub`` distribution as
# ``spikeforge_hub.client``; it is deliberately not here, so a user installing
# the client does not pull a web framework.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeforge-hub-api"
version = "0.1.0"
description = "Accounts, quotas, and community model hosting for spikeforge."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Capsize LLC", email = "contact@capsizegames.com" },
]
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # The password layer, OAuth2 flow, and token primitives. Pre-PyPI, so
    # the container installs it from source via the CAPSIZE_AUTH_SPEC build
    # argument; see the Dockerfile.
    "capsize-auth>=0.1.0",
    # Shared Capsize library: settings base and SQLAlchemy conventions.
    "capsize-commons[config,db,web]>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
spikeforge-hub-api = "hub_api.__main__:main"

[tool.setuptools.packages.find]
include = ["hub_api*"]
